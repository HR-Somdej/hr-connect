<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบติดตามใบประกอบวิชาชีพ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fb; --surface:#ffffffcc; --surface-solid:#fff; --line:#e3e9f2; --text:#0f1b2d; --muted:#64748b;
  --brand:#0d9488; --brand-2:#6366f1; --ok:#16a34a; --warn:#f59e0b; --bad:#ef4444; --info:#3b82f6;
  --ok-bg:#dcfce7; --warn-bg:#fef3c7; --bad-bg:#fee2e2; --info-bg:#dbeafe; --vio-bg:#ede9fe; --vio:#7c3aed;
  --shadow:0 8px 30px rgba(15,27,45,.07); --radius:18px;
}
[data-theme="dark"]{
  --bg:#0b1220; --surface:#121b2dcc; --surface-solid:#121b2d; --line:#223049; --text:#e6edf7; --muted:#8fa0b8;
  --ok-bg:#12351f; --warn-bg:#3b2d0b; --bad-bg:#3d1717; --info-bg:#14284a; --vio-bg:#2a2150;
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Prompt','Noto Sans Thai',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none}
body::before{width:480px;height:480px;background:#14b8a6;top:-140px;left:-120px;animation:float 14s ease-in-out infinite}
body::after{width:520px;height:520px;background:#818cf8;bottom:-180px;right:-140px;animation:float 18s ease-in-out infinite reverse}
[data-theme="dark"] body::before,[data-theme="dark"] body::after{opacity:.18}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}
button{font-family:inherit;cursor:pointer}
.app{position:relative;z-index:1;max-width:1320px;margin:auto;padding:18px 20px 60px}

/* header */
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:12px 16px;box-shadow:var(--shadow);position:sticky;top:10px;z-index:20}
.logo{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo i{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-style:normal;font-size:22px;box-shadow:0 6px 18px rgba(13,148,136,.4)}
.logo b{display:block;font-size:16px;font-weight:600;line-height:1.2}
.logo small{color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:14px;border:1px solid var(--line)}
nav button{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:10px;font-size:14px;font-weight:500;display:flex;gap:6px;align-items:center;transition:.2s}
nav button:hover{color:var(--text)}
nav button.on{background:var(--surface-solid);color:var(--brand);box-shadow:0 2px 10px rgba(15,27,45,.08)}
.badge-n{background:var(--bad);color:#fff;font-size:11px;border-radius:99px;padding:1px 7px;min-width:20px;text-align:center}
.iconbtn{border:1px solid var(--line);background:var(--surface-solid);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:17px;transition:.2s}
.iconbtn:hover{transform:translateY(-2px);border-color:var(--brand)}
.btn{border:0;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:500;display:inline-flex;gap:7px;align-items:center;transition:.2s;background:var(--surface-solid);color:var(--text);border:1px solid var(--line)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(15,27,45,.1)}
.btn.pri{background:linear-gradient(135deg,var(--brand),#14b8a6);color:#fff;border:0;box-shadow:0 6px 18px rgba(13,148,136,.35)}
.btn.ok{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;border:0}
.btn.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn.warn{background:var(--warn-bg);color:#b45309;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.spin{display:inline-block;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* hero */
.hero{margin:22px 4px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hero h1{font-size:26px;font-weight:600}
.hero h1 span{background:linear-gradient(90deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:14px;margin-top:2px}

/* cards */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1.1fr 1.4fr}
.g3{grid-template-columns:1.2fr 1fr 1fr}
@media(max-width:1050px){.g4{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}}
@media(max-width:560px){.g4{grid-template-columns:1fr 1fr;gap:10px}header{position:static}nav{width:100%;overflow-x:auto}}
.card{background:var(--surface);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card h3{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 small{margin-left:auto;color:var(--muted);font-weight:400;font-size:12px}
.stat{cursor:pointer;position:relative;overflow:hidden;transition:.25s}
.stat:hover{transform:translateY(-4px)}
.stat .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;margin-bottom:10px}
.stat .num{font-size:38px;font-weight:700;line-height:1}
.stat .lb{color:var(--muted);font-size:13px;margin-top:6px}
.stat .sub{font-size:12px;margin-top:8px;color:var(--muted)}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:currentColor;opacity:.07}
.stat.s-ok{color:var(--ok)}.stat.s-warn{color:var(--warn)}.stat.s-bad{color:var(--bad)}.stat.s-vio{color:var(--vio)}
.stat .num,.stat .lb,.stat .sub{color:var(--text)}.stat .lb,.stat .sub{color:var(--muted)}
.stat.pulse .ic{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}70%{box-shadow:0 0 0 14px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}

/* donut */
.donutwrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
.donut{position:relative;width:190px;height:190px}
.donut svg{transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:22;stroke-linecap:butt;transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1)}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .mid b{font-size:34px;font-weight:700;line-height:1}
.donut .mid span{font-size:12px;color:var(--muted)}
.legend{display:grid;gap:10px;font-size:14px}
.legend div{display:flex;align-items:center;gap:9px}
.legend i{width:12px;height:12px;border-radius:4px}
.legend b{margin-left:auto;padding-left:20px}

/* bars */
.bars{display:flex;align-items:flex-end;gap:7px;height:170px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;cursor:default}
.bar .col{width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--brand-2),var(--brand));height:0;transition:height 1s cubic-bezier(.2,.8,.2,1);min-height:3px;position:relative}
.bar .col.zero{background:var(--line)}
.bar .col.hot{background:linear-gradient(180deg,#fbbf24,var(--bad))}
.bar .v{font-size:12px;font-weight:600}
.bar .m{font-size:11px;color:var(--muted)}
.hbar{display:grid;gap:11px}
.hrow .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.hrow .track{height:10px;border-radius:99px;background:var(--line);display:flex;overflow:hidden}
.hrow .track span{height:100%;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:760px){.pipe{grid-template-columns:repeat(2,1fr)}}
.pipe div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;cursor:pointer;transition:.2s}
.pipe div:hover{border-color:var(--brand);transform:translateY(-2px)}
.pipe b{display:block;font-size:24px;font-weight:700}
.pipe span{font-size:12px;color:var(--muted)}

/* urgent list */
.urg{display:grid;gap:8px;max-height:330px;overflow:auto}
.urg .it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);cursor:pointer;transition:.2s}
.urg .it:hover{border-color:var(--brand);transform:translateX(3px)}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:600;color:#fff;flex:none;font-size:15px}
.urg .nm{font-weight:500;font-size:14px}
.urg .sm{font-size:12px;color:var(--muted)}
.urg .dd{margin-left:auto;text-align:right;font-size:12px;font-weight:600;white-space:nowrap}

/* chips/badges */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:#b45309}
[data-theme="dark"] .chip.warn{color:#fbbf24}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.vio{background:var(--vio-bg);color:var(--vio)}
.chip.gray{background:var(--line);color:var(--muted)}

/* toolbar + table */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 12px;align-items:center}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border-radius:13px;border:1px solid var(--line);background:var(--surface-solid);color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.2s}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(13,148,136,.15)}
.search::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px}
select,input[type=text],input[type=email],input[type=date],textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface-solid);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;width:100%;transition:.2s}
select:focus,input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(13,148,136,.15)}
.toolbar select{width:auto;min-width:150px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchips button{border:1px solid var(--line);background:var(--surface-solid);color:var(--muted);padding:7px 13px;border-radius:99px;font-size:13px;transition:.2s}
.fchips button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tbl{background:var(--surface);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:900px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface-solid)}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
tr.row{cursor:pointer;transition:.15s}
tr.row:hover{background:rgba(13,148,136,.06)}
tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:10px}
.who small{display:block;color:var(--muted);font-size:12px}
.life{width:130px}
.life .t{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px}
.life .t i{display:block;height:100%;border-radius:99px}
.empty{padding:50px;text-align:center;color:var(--muted)}
.empty b{display:block;font-size:38px;margin-bottom:8px}

/* drawer + modal */
.overlay{position:fixed;inset:0;background:rgba(8,15,30,.5);backdrop-filter:blur(3px);z-index:50;opacity:0;pointer-events:none;transition:.25s}
.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);background:var(--surface-solid);z-index:60;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:24px;overflow:auto;border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.2)}
.drawer.on{transform:none}
.modal{position:fixed;z-index:70;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;transition:.25s;width:min(1080px,96vw);max-height:92vh;overflow:auto;background:var(--surface-solid);border-radius:24px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.35);padding:24px}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal.sm{width:min(560px,96vw)}
.xbtn{position:absolute;top:16px;right:16px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:14px;margin:14px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;word-break:break-word}
.steps{display:flex;align-items:flex-start;margin:20px 0 10px}
.steps .s{flex:1;text-align:center;position:relative;font-size:11px;color:var(--muted)}
.steps .s::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.steps .s:first-child::before{display:none}
.steps .s.done::before{background:var(--brand)}
.steps .s i{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;margin:0 auto 6px;font-style:normal;font-size:13px;color:#fff}
.steps .s.done i{background:var(--brand)}
.steps .s.cur i{background:var(--brand-2);box-shadow:0 0 0 5px rgba(99,102,241,.25)}
.steps .s.cur{color:var(--text);font-weight:600}
.steps .s.warn i{background:var(--warn)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.form .full{grid-column:1/-1}
@media(max-width:600px){.form{grid-template-columns:1fr}}
.review{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;margin-top:10px}
@media(max-width:900px){.review{grid-template-columns:1fr}}
.preview{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg);height:62vh;min-height:360px}
.preview iframe{width:100%;height:100%;border:0}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;padding:8px 10px;border-radius:10px;background:var(--bg);margin-bottom:6px;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:1px;accent-color:var(--brand);flex:none}
.auto{display:flex;gap:8px;font-size:13px;padding:6px 0;align-items:flex-start}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--bg);border-radius:14px;padding:12px;margin:10px 0}
.cmp small{color:var(--muted);font-size:11px}
.cmp b{display:block;font-size:14px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.rcard{cursor:pointer;transition:.25s}
.rcard:hover{transform:translateY(-4px);border-color:var(--brand-2)}
.tl{display:grid;gap:0}
.tl .e{display:flex;gap:14px;padding:11px 4px;border-bottom:1px dashed var(--line);font-size:13.5px}
.tl .e time{color:var(--muted);min-width:128px;font-size:12px}
.tl .e .ty{min-width:112px}

/* toast */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:100;display:grid;gap:8px}
.toast{background:var(--text);color:var(--bg);padding:12px 20px;border-radius:14px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:rise .3s both}
.toast.err{background:var(--bad);color:#fff}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:200}
.skeleton{height:120px;border-radius:18px;background:linear-gradient(90deg,var(--line),transparent,var(--line));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><i>🏥</i><div><b>ระบบติดตามใบประกอบวิชาชีพ</b><small id="hosp">ฝ่ายทรัพยากรบุคคล</small></div></div>
    <nav id="nav">
      <button data-v="dash" class="on">📊 ภาพรวม</button>
      <button data-v="staff">👥 รายชื่อ</button>
      <button data-v="review">🧾 รอตรวจสอบ <span class="badge-n" id="nrev" style="display:none">0</span></button>
      <button data-v="log">🕘 ประวัติ</button>
    </nav>
    <button class="btn" id="runBtn" title="ตรวจและส่งแจ้งเตือน + ตรวจอีเมลตอบกลับตอนนี้">🔄 ตรวจตอนนี้</button>
    <button class="iconbtn" id="themeBtn" title="สลับโหมดมืด/สว่าง">🌙</button>
  </header>

  <div id="view"><div class="grid g4" style="margin-top:24px"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
</div>

<div class="overlay" id="ov"></div>
<aside class="drawer" id="drawer"></aside>
<section class="modal" id="modal"></section>
<div id="toasts"></div>
<canvas id="cf"></canvas>

<script>
let D = null, view = 'dash', fil = 'all', q = '', profF = '', deptF = '';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function fd(iso){ if(!iso) return '-'; const p=iso.slice(0,10).split('-'); return (+p[2])+' '+TH_M[+p[1]-1]+' '+(+p[0]+543); }
function ft(iso){ if(!iso) return '-'; return fd(iso)+(iso.length>10?' '+iso.slice(11,16)+' น.':''); }
const COLORS = ['#0d9488','#6366f1','#f59e0b','#ec4899','#3b82f6','#8b5cf6','#14b8a6','#ef4444'];
const colorOf = s => { let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; };
const initial = n => String(n||'?').replace(/^(นาย|นางสาว|นาง|น\.ส\.|ดร\.|นพ\.|พญ\.|ทพ\.|ภก\.|ภญ\.)\s*/,'').trim().charAt(0) || '?';
const FLOW = ['ยังไม่ดำเนินการ','แจ้งครั้งที่ 1 แล้ว','แจ้งครั้งที่ 2 แล้ว','รอตรวจสอบเอกสาร','ต่ออายุแล้ว'];

/* ---------- data ---------- */
function load(silent){
  google.script.run.withSuccessHandler(d=>{ D=d; $('#hosp').textContent=d.cfg.HOSPITAL_NAME; render(); })
    .withFailureHandler(e=>toast(e.message||String(e),1)).getAppData();
}
function active(){ return D.staff.filter(s=>s.active&&s.req); }
function pendingSubs(){ return D.subs.filter(s=>s.status==='รอตรวจสอบ'); }
function stats(){
  const a = active(); const st = {total:a.length, ok:0, soon:0, exp:0, soon30:0, review:0, renewed:0, nodate:0, life:0};
  a.forEach(s=>{
    if(s.lic==='ปกติ') st.ok++; else if(s.lic==='ใกล้หมดอายุ'){ st.soon++; if(s.days<=30) st.soon30++; } else if(s.lic==='หมดอายุ') st.exp++; else if(s.lic==='ตลอดชีพ') st.life++; else st.nodate++;
    if(s.flow==='รอตรวจสอบเอกสาร') st.review++;
    if(s.flow==='ต่ออายุแล้ว') st.renewed++;
  });
  return st;
}
function render(){
  const n = pendingSubs().length; const b=$('#nrev'); b.textContent=n; b.style.display=n?'':'none';
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===view));
  ({dash:rDash,staff:rStaff,review:rReview,log:rLog})[view]();
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();window.scrollTo({top:0,behavior:'smooth'});});

/* ---------- dashboard ---------- */
function rDash(){
  const s = stats(), a = active();
  const segs = [['ปกติ',s.ok,'#16a34a'],['ใกล้หมดอายุ',s.soon,'#f59e0b'],['หมดอายุแล้ว',s.exp,'#ef4444'],['ตลอดชีพ (แพทย์)',s.life,'#3b82f6'],['ยังไม่มีข้อมูลวันหมดอายุ',s.nodate,'#94a3b8']];
  const tot = Math.max(s.ok+s.soon+s.exp+s.life+s.nodate,1);
  // 12-month forecast
  const now = new Date(D.today); const months=[];
  for(let i=0;i<12;i++){ const d=new Date(now.getFullYear(),now.getMonth()+i,1); months.push({y:d.getFullYear(),m:d.getMonth(),n:0}); }
  a.forEach(x=>{ if(!x.expiry||x.days<0) return; const d=new Date(x.expiry); const i=(d.getFullYear()-now.getFullYear())*12+d.getMonth()-now.getMonth(); if(i>=0&&i<12) months[i].n++; });
  const maxM = Math.max(...months.map(m=>m.n),1);
  // by profession
  const pf = {}; a.forEach(x=>{ const k=x.prof||'ไม่ระบุ'; (pf[k]=pf[k]||{ok:0,soon:0,exp:0,n:0}).n++; if(x.lic==='ปกติ'||x.lic==='ตลอดชีพ')pf[k].ok++; else if(x.lic==='ใกล้หมดอายุ')pf[k].soon++; else if(x.lic==='หมดอายุ')pf[k].exp++; });
  const pfl = Object.entries(pf).sort((x,y)=>(y[1].exp*100+y[1].soon)-(x[1].exp*100+x[1].soon)||y[1].n-x[1].n).slice(0,8);
  const urgent = a.filter(x=>x.days!==null && x.days<=30 && x.flow!=='รอตรวจสอบเอกสาร').sort((x,y)=>x.days-y.days).slice(0,12);
  const flowCnt = FLOW.map(f=>a.filter(x=>x.flow===f).length);
  flowCnt[3] += 0;
  const rejected = a.filter(x=>x.flow==='ส่งกลับแก้ไข').length;

  let c=0, off=0;
  const circ = 2*Math.PI*70;
  const circles = segs.map(sg=>{ const len = sg[1]/tot*circ; const el=`<circle cx="95" cy="95" r="70" stroke="${sg[2]}" data-len="${len}" data-off="${off}" stroke-dasharray="0 ${circ}" stroke-dashoffset="${-off}"/>`; off+=len; return el; }).join('');

  $('#view').innerHTML = `
  <div class="hero"><div><h1>สวัสดี 👋 <span>ภาพรวมใบประกอบวิชาชีพ</span></h1><p>อัปเดต ${fd(D.today)} • ติดตาม ${s.total} ราย จากบุคลากรทั้งหมด ${D.staff.length} ราย • เกณฑ์ใกล้หมดอายุ = ภายใน ${D.cfg.DAYS_BEFORE} วัน (3 เดือน) • ผู้ใช้: ${esc(D.me)}</p></div>
    <button class="btn pri" onclick="openStaffForm()">➕ เพิ่มบุคลากร</button></div>

  <div class="grid g4" style="margin-top:14px">
    <div class="card stat s-warn" style="animation-delay:.05s" onclick="goStaff('ใกล้หมดอายุ')"><div class="ic" style="background:var(--warn-bg)">⏳</div><div class="num" data-n="${s.soon}">0</div><div class="lb">ใกล้หมดอายุ (ภายใน 3 เดือน)</div><div class="sub">ภายใน 30 วัน: <b style="color:var(--bad)">${s.soon30}</b> ราย</div></div>
    <div class="card stat s-bad ${s.exp?'pulse':''}" style="animation-delay:.1s" onclick="goStaff('หมดอายุ')"><div class="ic" style="background:var(--bad-bg)">⛔</div><div class="num" data-n="${s.exp}">0</div><div class="lb">หมดอายุแล้ว</div><div class="sub">ต้องติดตามเร่งด่วน</div></div>
    <div class="card stat s-vio" style="animation-delay:.15s" onclick="view='review';render()"><div class="ic" style="background:var(--vio-bg)">🧾</div><div class="num" data-n="${pendingSubs().length}">0</div><div class="lb">เอกสารรอตรวจสอบ</div><div class="sub">เจ้าหน้าที่ส่งสำเนากลับมาแล้ว</div></div>
    <div class="card stat s-ok" style="animation-delay:.2s" onclick="goStaff('ปกติ')"><div class="ic" style="background:var(--ok-bg)">✅</div><div class="num" data-n="${s.ok}">0</div><div class="lb">ปกติ</div><div class="sub">จากทั้งหมด ${s.total} ราย • ตลอดชีพ ${s.life} • ยังไม่มีข้อมูล ${s.nodate}</div></div>
  </div>

  <div class="grid g2" style="margin-top:16px">
    <div class="card" style="animation-delay:.25s"><h3>🍩 สัดส่วนสถานะใบประกอบ</h3>
      <div class="donutwrap"><div class="donut"><svg width="190" height="190" viewBox="0 0 190 190"><circle cx="95" cy="95" r="70" stroke="var(--line)" stroke-dasharray="${circ} 0"/>${circles}</svg>
        <div class="mid"><b data-n="${s.total}">0</b><span>บุคลากรทั้งหมด</span></div></div>
        <div class="legend">${segs.map(sg=>`<div><i style="background:${sg[2]}"></i>${sg[0]}<b>${sg[1]}</b></div>`).join('')}</div></div></div>
    <div class="card" style="animation-delay:.3s"><h3>📅 คาดการณ์ใบประกอบที่จะหมดอายุ 12 เดือนข้างหน้า <small>จำนวนคน/เดือน</small></h3>
      <div class="bars">${months.map((m,i)=>`<div class="bar" title="${TH_M[m.m]} ${m.y+543}: ${m.n} ราย"><span class="v">${m.n||''}</span><div class="col ${m.n?'':'zero'} ${i<3&&m.n?'hot':''}" data-h="${m.n/maxM*100}"></div><span class="m">${TH_M[m.m]}</span></div>`).join('')}</div>
      <div class="hint">แท่งสีส้ม–แดง = 3 เดือนแรก (อยู่ในช่วงที่ระบบแจ้งเตือน)</div></div>
  </div>

  <div class="grid g3" style="margin-top:16px">
    <div class="card" style="animation-delay:.35s"><h3>🚨 ต้องดำเนินการด่วน <small>หมดอายุ/เหลือ ≤ 30 วัน</small></h3>
      <div class="urg">${urgent.length?urgent.map(x=>`<div class="it" onclick="openStaff('${x.id}')"><div class="avatar" style="background:${colorOf(x.name)}">${esc(initial(x.name))}</div><div><div class="nm">${esc(x.name)}</div><div class="sm">${esc(x.prof)} • ${esc(x.flow)}</div></div><div class="dd" style="color:${x.days<0?'var(--bad)':'var(--warn)'}">${x.days<0?'เลย '+(-x.days)+' วัน':'อีก '+x.days+' วัน'}<div class="sm">${fd(x.expiry)}</div></div></div>`).join(''):'<div class="empty"><b>🎉</b>ไม่มีรายการเร่งด่วน</div>'}</div></div>
    <div class="card" style="animation-delay:.4s"><h3>🩺 แยกตามวิชาชีพ</h3>
      <div class="hbar">${pfl.map(([k,v])=>`<div class="hrow"><div class="top"><span>${esc(k)}</span><span style="color:var(--muted)">${v.n} คน${v.exp?` • <b style="color:var(--bad)">หมดอายุ ${v.exp}</b>`:''}${v.soon?` • <b style="color:var(--warn)">ใกล้ ${v.soon}</b>`:''}</span></div>
        <div class="track"><span style="background:#16a34a" data-w="${v.ok/v.n*100}"></span><span style="background:#f59e0b" data-w="${v.soon/v.n*100}"></span><span style="background:#ef4444" data-w="${v.exp/v.n*100}"></span></div></div>`).join('')||'<div class="empty">ยังไม่มีข้อมูล</div>'}</div></div>
    <div class="card" style="animation-delay:.45s"><h3>🧭 สถานะการติดตาม</h3>
      <div class="pipe">${FLOW.map((f,i)=>`<div onclick="goFlow('${f}')"><b data-n="${flowCnt[i]}">0</b><span>${f}</span></div>`).join('')}</div>
      ${rejected?`<div class="chip warn" style="margin-top:12px;cursor:pointer" onclick="goFlow('ส่งกลับแก้ไข')">↩️ ส่งกลับแก้ไข ${rejected} ราย (รอเจ้าหน้าที่ส่งใหม่)</div>`:''}
      <div class="hint" style="margin-top:14px">ระบบส่งแจ้งเตือนอัตโนมัติทุกวัน ~08:00 และตรวจอีเมลตอบกลับทุก 1 ชั่วโมง</div></div>
  </div>`;
  requestAnimationFrame(()=>setTimeout(animate,60));
}
function animate(){
  document.querySelectorAll('[data-n]').forEach(el=>{ const t=+el.dataset.n; const t0=performance.now(); const dur=900;
    (function f(now){ const p=Math.min((now-t0)/dur,1); el.textContent=Math.round(t*(1-Math.pow(1-p,3))); if(p<1)requestAnimationFrame(f); })(t0); });
  document.querySelectorAll('.donut circle[data-len]').forEach(c=>{ const circ=2*Math.PI*70; c.setAttribute('stroke-dasharray', c.dataset.len+' '+(circ-c.dataset.len)); });
  document.querySelectorAll('.col[data-h]').forEach(c=>c.style.height=c.dataset.h+'%');
  document.querySelectorAll('.track span[data-w]').forEach(c=>c.style.width=c.dataset.w+'%');
}
function goStaff(f){ view='staff'; fil=f; profF=''; render(); }
function goFlow(f){ view='staff'; fil='flow:'+f; render(); }

/* ---------- staff list ---------- */
function licChip(s){ const m={'ปกติ':['ok','🟢','ปกติ'],'ใกล้หมดอายุ':['warn','🟡','ใกล้หมดอายุ'],'หมดอายุ':['bad','🔴','หมดอายุแล้ว'],'ตลอดชีพ':['info','♾️','ตลอดชีพ'],'ไม่ระบุ':['gray','⚪','ยังไม่มีข้อมูล']}; const x=m[s.lic]||['gray','⚪',s.lic]; return `<span class="chip ${x[0]}">${x[1]} ${x[2]}</span>`; }
function flowChip(f){ const m={'ยังไม่ดำเนินการ':'gray','แจ้งครั้งที่ 1 แล้ว':'warn','แจ้งครั้งที่ 2 แล้ว':'bad','รอตรวจสอบเอกสาร':'vio','ส่งกลับแก้ไข':'warn','ต่ออายุแล้ว':'ok'}; return `<span class="chip ${m[f]||'gray'}">${esc(f)}</span>`; }
function lifeBar(s){
  if(s.days===null) return '-';
  const pct = s.days<0?100:Math.max(4,Math.min(100,100-(s.days/365*100)));
  const col = s.days<0?'var(--bad)':s.days<=D.cfg.DAYS_BEFORE?'var(--warn)':'var(--ok)';
  return `<div class="life"><span style="font-size:12px;color:${col};font-weight:600">${s.days<0?'เลยมา '+(-s.days)+' วัน':'เหลือ '+s.days+' วัน'}</span><div class="t"><i style="width:${pct}%;background:${col}"></i></div></div>`;
}
function filtered(){
  return D.staff.filter(s=>{
    if(fil==='noreq'){ if(s.req) return false; }
    else if(fil==='inactive'){ if(s.active) return false; }
    else if(!s.active||!s.req) return false;
    if(['ปกติ','ใกล้หมดอายุ','หมดอายุ','ตลอดชีพ','ไม่ระบุ'].includes(fil) && s.lic!==fil) return false;
    if(fil==='รอตรวจสอบ' && s.flow!=='รอตรวจสอบเอกสาร') return false;
    if(fil.startsWith('flow:') && s.flow!==fil.slice(5)) return false;
    if(profF && s.prof!==profF) return false;
    if(deptF && s.dept!==deptF) return false;
    if(q){ const t=(s.name+s.id+s.empId+s.prof+s.position+s.dept+s.licNo+s.email).toLowerCase(); if(!t.includes(q.toLowerCase())) return false; }
    return true;
  }).sort((a,b)=>(a.days===null?9999:a.days)-(b.days===null?9999:b.days));
}
function rStaff(){
  const profs=[...new Set(D.staff.map(s=>s.prof).filter(Boolean))].sort();
  const depts=[...new Set(D.staff.map(s=>s.dept).filter(Boolean))].sort();
  const chips=[['all','ทั้งหมด (ที่ต้องมีใบประกอบ)'],['ใกล้หมดอายุ','🟡 ใกล้หมดอายุ'],['หมดอายุ','🔴 หมดอายุแล้ว'],['รอตรวจสอบ','🧾 รอตรวจสอบ'],['ปกติ','🟢 ปกติ'],['ตลอดชีพ','♾️ ตลอดชีพ'],['ไม่ระบุ','⚪ ยังไม่มีข้อมูล'],['noreq','ไม่ต้องมีใบประกอบ'],['inactive','พ้นสภาพ']];
  $('#view').innerHTML = `
  <div class="hero"><div><h1><span>รายชื่อบุคลากร</span></h1><p>คลิกแถวเพื่อดูรายละเอียด ส่งแจ้งเตือน และประวัติเอกสาร</p></div><button class="btn pri" onclick="openStaffForm()">➕ เพิ่มบุคลากร</button></div>
  <div class="toolbar"><div class="search"><input id="q" placeholder="ค้นหาชื่อ / รหัส / เลขที่ใบอนุญาต / หน่วยงาน…" value="${esc(q)}"></div>
    <select id="pf"><option value="">ทุกวิชาชีพ</option>${profs.map(p=>`<option ${p===profF?'selected':''}>${esc(p)}</option>`).join('')}</select>
    <select id="df"><option value="">ทุกหน่วยงาน</option>${depts.map(p=>`<option ${p===deptF?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
  <div class="fchips">${chips.map(c=>`<button class="${fil===c[0]?'on':''}" data-f="${c[0]}">${c[1]}</button>`).join('')}${fil.startsWith('flow:')?`<button class="on" data-f="all">สถานะ: ${esc(fil.slice(5))} ✕</button>`:''}</div>
  <div class="tbl" style="margin-top:12px" id="tbl"></div>`;
  $('#q').oninput=e=>{q=e.target.value;drawTable();};
  $('#pf').onchange=e=>{profF=e.target.value;drawTable();};
  $('#df').onchange=e=>{deptF=e.target.value;drawTable();};
  document.querySelectorAll('.fchips button').forEach(b=>b.onclick=()=>{fil=b.dataset.f;rStaff();});
  drawTable();
}
function drawTable(){
  const all=filtered(), list=all.slice(0,300);
  $('#tbl').innerHTML = list.length ? `<table><thead><tr><th>บุคลากร</th><th>วิชาชีพ / เลขที่</th><th>หน่วยงาน</th><th>หมดอายุ</th><th>เหลือเวลา</th><th>สถานะใบประกอบ</th><th>สถานะติดตาม</th></tr></thead><tbody>
    ${list.map(s=>`<tr class="row" onclick="openStaff('${s.id}')"><td><div class="who"><div class="avatar" style="background:${colorOf(s.name)}">${esc(initial(s.name))}</div><div>${esc(s.name)}<small>${esc(s.empId||s.id)} • ${esc(s.position)}</small></div></div></td>
    <td>${esc(s.prof)}<small style="display:block;color:var(--muted);font-size:12px">${esc(s.licNo)}</small></td><td>${esc(s.dept)}</td><td>${fd(s.expiry)}</td><td>${lifeBar(s)}</td><td>${licChip(s)}</td><td>${flowChip(s.flow)}</td></tr>`).join('')}</tbody></table>${all.length>300?`<div class="hint" style="padding:12px 16px">แสดง 300 จาก ${all.length} รายการ — พิมพ์ค้นหาหรือเลือกตัวกรองเพื่อดูเพิ่ม</div>`:''}`
    : '<div class="empty"><b>🗂️</b>ไม่พบข้อมูลตามเงื่อนไข</div>';
}

/* ---------- drawer ---------- */
function openStaff(id){
  const s=D.staff.find(x=>x.id===id); if(!s) return;
  const hist=D.subs.filter(x=>x.staffId===id);
  let cur = FLOW.indexOf(s.flow); if(s.flow==='ส่งกลับแก้ไข') cur=3;
  $('#drawer').innerHTML = `
  <div style="display:flex;gap:14px;align-items:center"><div class="avatar" style="background:${colorOf(s.name)};width:56px;height:56px;font-size:22px;border-radius:18px">${esc(initial(s.name))}</div>
    <div><div style="font-size:18px;font-weight:600">${esc(s.name)}</div><div style="color:var(--muted);font-size:13px">${esc(s.empId||s.id)} • ${esc(s.position)}</div></div>
    <button class="iconbtn" style="margin-left:auto" onclick="closeAll()">✕</button></div>
  <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">${licChip(s)} ${flowChip(s.flow)}</div>
  <div class="steps">${FLOW.map((f,i)=>`<div class="s ${i<cur?'done':''} ${i===cur?(s.flow==='ส่งกลับแก้ไข'?'cur warn':'cur'):''}"><i>${i<cur?'✓':i+1}</i>${f.replace(' แล้ว','').replace('เอกสาร','')}</div>`).join('')}</div>
  ${s.flow==='ส่งกลับแก้ไข'?'<div class="chip warn">↩️ ส่งกลับให้แก้ไขเอกสาร รอเจ้าหน้าที่ส่งใหม่</div>':''}
  <dl class="kv"><dt>วิชาชีพ</dt><dd>${esc(s.prof)}</dd><dt>เลขที่ใบอนุญาต</dt><dd>${esc(s.licNo||'-')}</dd><dt>การต่ออายุ</dt><dd>${esc(s.renew||'-')}</dd><dt>รหัสในระบบ</dt><dd>${esc(s.id)}</dd><dt>หน่วยงาน</dt><dd>${esc(s.dept)}</dd>
  <dt>อีเมล</dt><dd>${esc(s.email)}</dd><dt>วันออกบัตร</dt><dd>${fd(s.issue)}</dd><dt>วันหมดอายุ</dt><dd>${fd(s.expiry)} ${s.days!==null?`<span style="color:${s.days<0?'var(--bad)':'var(--muted)'}">(${s.days<0?'เลย '+(-s.days)+' วัน':'อีก '+s.days+' วัน'})</span>`:''}</dd>
  <dt>แจ้งครั้งที่ 1</dt><dd>${ft(s.n1)}</dd><dt>แจ้งครั้งที่ 2</dt><dd>${ft(s.n2)}</dd>${s.note?`<dt>หมายเหตุ</dt><dd>${esc(s.note)}</dd>`:''}</dl>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:16px 0">
    <button class="btn warn" onclick="notify('${s.id}',1,this)">📧 ส่งแจ้งเตือนครั้งที่ 1</button>
    <button class="btn bad" onclick="notify('${s.id}',2,this)">📧 ส่งแจ้งเตือนครั้งที่ 2</button>
    <button class="btn" onclick="openStaffForm('${s.id}')">✏️ แก้ไข</button></div>
  <h3 style="font-size:15px;margin:22px 0 8px">📎 เอกสารที่ส่งมา (${hist.length})</h3>
  ${hist.length?hist.map(h=>`<div class="card" style="padding:12px 14px;margin-bottom:8px;animation:none"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="font-size:13.5px">${esc(h.fileName)}</b><span class="chip ${h.status==='อนุมัติ'?'ok':h.status==='รอตรวจสอบ'?'vio':'warn'}" style="margin-left:auto">${esc(h.status)}</span></div>
    <div class="hint">ได้รับ ${ft(h.at)}${h.reviewer?` • ตรวจโดย ${esc(h.reviewer)}`:''}${h.newExpiry?` • หมดอายุใหม่ ${fd(h.newExpiry)}`:''}</div>
    ${h.note?`<div class="hint">หมายเหตุ: ${esc(h.note)}</div>`:''}
    <div style="margin-top:8px;display:flex;gap:8px"><a class="btn" style="padding:6px 12px;text-decoration:none" target="_blank" href="${esc(h.url)}">เปิดไฟล์</a>${h.status==='รอตรวจสอบ'?`<button class="btn pri" style="padding:6px 12px" onclick="openReview('${h.id}')">ตรวจสอบ</button>`:''}</div></div>`).join(''):'<div class="hint">ยังไม่มีเอกสารที่ส่งมา</div>'}`;
  $('#drawer').classList.add('on'); $('#ov').classList.add('on');
}
function closeAll(){ $('#drawer').classList.remove('on'); $('#modal').classList.remove('on'); $('#ov').classList.remove('on'); }
$('#ov').onclick=closeAll;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeAll(); });

function notify(id,round,btn){
  const s=D.staff.find(x=>x.id===id);
  if(!confirm('ส่งอีเมลแจ้งเตือนครั้งที่ '+round+' ถึง '+s.name+' ('+s.email+') ใช่หรือไม่?')) return;
  btn.disabled=true; btn.innerHTML='<span class="spin">⏳</span> กำลังส่ง…';
  google.script.run.withSuccessHandler(m=>{toast('✅ '+m);load();setTimeout(()=>openStaff(id),400);})
    .withFailureHandler(e=>{toast(e.message,1);btn.disabled=false;}).manualNotify(id,round);
}

/* ---------- staff form ---------- */

  const s = id ? D.staff.find(x=>x.id===id) : {name:'',position:'',dept:'',email:'',prof:'',licNo:'',issue:'',expiry:'',note:'',active:true,req:true,renew:'5 ปี',empId:''};
  $('#modal').className='modal sm on';
  $('#modal').innerHTML = `<button class="iconbtn xbtn" onclick="closeAll()">✕</button>
  <h2 style="font-size:20px;margin-bottom:16px">${id?'✏️ แก้ไขข้อมูลบุคลากร':'➕ เพิ่มบุคลากร'}</h2>
  <div class="form">
    <div class="full"><label>ชื่อ-สกุล *</label><input type="text" id="f_name" value="${esc(s.name)}"></div>
    <div><label>ตำแหน่ง</label><input type="text" id="f_pos" value="${esc(s.position)}"></div>
    <div><label>หน่วยงาน</label><input type="text" id="f_dept" value="${esc(s.dept)}"></div>
    <div class="full"><label>อีเมล (ใช้ส่งแจ้งเตือน) *</label><input type="email" id="f_mail" value="${esc(s.email)}"></div>
    <div><label>วิชาชีพ</label><input type="text" id="f_prof" list="pl" value="${esc(s.prof)}"><datalist id="pl">${[...new Set(D.staff.map(x=>x.prof).filter(Boolean))].map(p=>`<option value="${esc(p)}">`).join('')}</datalist></div>
    <div><label>เลขที่ใบอนุญาต</label><input type="text" id="f_no" value="${esc(s.licNo)}"></div>
    <div><label>วันออกบัตร</label><input type="date" id="f_issue" value="${s.issue}"></div>
    <div><label>วันหมดอายุ</label><input type="date" id="f_exp" value="${s.expiry}"><div class="hint" id="f_th"></div></div>
    <div class="full"><label>หมายเหตุ</label><input type="text" id="f_note" value="${esc(s.note)}"></div>
    <div><label>ต้องมีใบประกอบ</label><select id="f_req"><option ${s.req?'selected':''}>ใช่</option><option ${s.req?'':'selected'}>ไม่ใช่</option></select></div>
    <div><label>การต่ออายุ</label><select id="f_renew"><option ${s.renew==='ตลอดชีพ'?'':'selected'}>5 ปี</option><option ${s.renew==='ตลอดชีพ'?'selected':''}>ตลอดชีพ</option></select></div>
    <div class="full"><label>รหัสเจ้าหน้าที่</label><input type="text" id="f_emp" value="${esc(s.empId)}"></div>
    ${id?`<div class="full"><label class="chk" style="margin:0"><input type="checkbox" id="f_act" ${s.active?'checked':''}> ยังปฏิบัติงานอยู่ (ถ้าพ้นสภาพ ให้เอาติ๊กออก ระบบจะไม่ส่งเมลอีก)</label></div>`:''}
  </div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px"><button class="btn" onclick="closeAll()">ยกเลิก</button><button class="btn pri" id="saveBtn">💾 บันทึก</button></div>`;
  $('#ov').classList.add('on'); $('#drawer').classList.remove('on');
  const thd=()=>{ const v=$('#f_exp').value; $('#f_th').textContent = v?'= '+fd(v)+' (พ.ศ.)':''; }; $('#f_exp').oninput=thd; thd();
  $('#saveBtn').onclick=()=>{
    const p={id:id||'',name:$('#f_name').value.trim(),position:$('#f_pos').value.trim(),dept:$('#f_dept').value.trim(),email:$('#f_mail').value.trim(),prof:$('#f_prof').value.trim(),licNo:$('#f_no').value.trim(),issue:$('#f_issue').value,expiry:$('#f_exp').value,note:$('#f_note').value.trim(),empId:$('#f_emp').value.trim(),req:$('#f_req').value==='ใช่',renew:$('#f_renew').value,active:id?$('#f_act').checked:true};
    const b=$('#saveBtn'); b.disabled=true; b.innerHTML='<span class="spin">⏳</span> กำลังบันทึก…';
    google.script.run.withSuccessHandler(()=>{toast('✅ บันทึกแล้ว');closeAll();load();}).withFailureHandler(e=>{toast(e.message,1);b.disabled=false;b.textContent='💾 บันทึก';}).saveStaff(p);
  };
}

/* ---------- review ---------- */
function rReview(){
  const list=pendingSubs(); const done=D.subs.filter(x=>x.status!=='รอตรวจสอบ').slice(0,12);
  $('#view').innerHTML = `<div class="hero"><div><h1><span>ตรวจสอบเอกสารต่ออายุ</span></h1><p>ตรวจความถูกต้องของไฟล์ที่เจ้าหน้าที่ตอบกลับมา ก่อนอนุมัติและอัปเดตวันหมดอายุในระบบ</p></div></div>
  <div class="rcards" style="margin-top:14px">${list.length?list.map((h,i)=>{ const s=D.staff.find(x=>x.id===h.staffId)||{}; const bad=h.checks.filter(c=>!c.ok).length;
    return `<div class="card rcard" style="animation-delay:${i*.05}s" onclick="openReview('${h.id}')"><div class="who"><div class="avatar" style="background:${colorOf(h.name)}">${esc(initial(h.name))}</div><div><b>${esc(h.name)}</b><small>${esc(s.prof||'')} • ${esc(h.staffId)}</small></div><span class="chip vio" style="margin-left:auto">รอตรวจสอบ</span></div>
    <div class="hint" style="margin-top:12px">📎 ${esc(h.fileName)}</div><div class="hint">ได้รับ ${ft(h.at)}</div>
    <div style="margin-top:10px">${bad?`<span class="chip warn">⚠️ ตรวจอัตโนมัติพบ ${bad} ข้อควรระวัง</span>`:'<span class="chip ok">✓ ผ่านการตรวจอัตโนมัติ</span>'}</div></div>`; }).join('')
    :'<div class="card empty" style="grid-column:1/-1"><b>📭</b>ไม่มีเอกสารรอตรวจสอบ</div>'}</div>
  ${done.length?`<h3 style="margin:28px 4px 10px;font-size:15px">ตรวจแล้วล่าสุด</h3><div class="tbl"><table><thead><tr><th>ชื่อ</th><th>ไฟล์</th><th>ผลการตรวจ</th><th>วันหมดอายุใหม่</th><th>ผู้ตรวจ</th><th>เมื่อ</th></tr></thead><tbody>${done.map(h=>`<tr><td>${esc(h.name)}</td><td>${esc(h.fileName)}</td><td><span class="chip ${h.status==='อนุมัติ'?'ok':'warn'}">${esc(h.status)}</span></td><td>${fd(h.newExpiry)}</td><td>${esc(h.reviewer)}</td><td>${ft(h.reviewedAt)}</td></tr>`).join('')}</tbody></table></div>`:''}`;
}
function openReview(subId){
  const h=D.subs.find(x=>x.id===subId); const s=D.staff.find(x=>x.id===h.staffId);
  $('#modal').className='modal on';
  $('#modal').innerHTML = `<button class="iconbtn xbtn" onclick="closeAll()">✕</button>
  <h2 style="font-size:20px">🧾 ตรวจสอบเอกสาร — ${esc(h.name)}</h2><div class="hint">${esc(h.fileName)} • ได้รับ ${ft(h.at)}</div>
  <div class="review"><div><div class="preview"><iframe src="https://drive.google.com/file/d/${esc(h.fileId)}/preview" allow="autoplay"></iframe></div>
    <div style="margin-top:8px"><a class="btn" style="text-decoration:none;padding:7px 12px" target="_blank" href="${esc(h.url)}">↗ เปิดไฟล์ในแท็บใหม่</a></div></div>
  <div>
    <h3 style="font-size:14px;margin-bottom:6px">🤖 ผลตรวจอัตโนมัติ</h3>${h.checks.map(c=>`<div class="auto"><span>${c.ok?'✅':'⚠️'}</span><span style="${c.ok?'':'color:var(--bad);font-weight:500'}">${esc(c.text)}</span></div>`).join('')}
    <div class="cmp"><div><small>ข้อมูลที่ลงทะเบียนไว้</small><b>${esc(s.name)}</b></div><div><small>เลขที่ใบอนุญาต</small><b>${esc(s.licNo)}</b></div><div><small>วิชาชีพ</small><b>${esc(s.prof)}</b></div><div><small>วันหมดอายุเดิม</small><b>${fd(s.expiry)}</b></div></div>
    <h3 style="font-size:14px;margin:12px 0 6px">☑️ เจ้าหน้าที่ตรวจเอกสาร (ติ๊กให้ครบก่อนอนุมัติ)</h3>
    <label class="chk"><input type="checkbox" class="rc"> ชื่อ-สกุลในเอกสารตรงกับบุคลากร</label>
    <label class="chk"><input type="checkbox" class="rc"> เลขที่ใบอนุญาต/วิชาชีพตรงกับที่ลงทะเบียน</label>
    <label class="chk"><input type="checkbox" class="rc"> มีลายเซ็น "รับรองสำเนาถูกต้อง" และวันที่</label>
    <label class="chk"><input type="checkbox" class="rc"> ไฟล์ชัดเจน อ่านออก ไม่ถูกตัดขอบ</label>
    <div class="form" style="margin-top:12px"><div><label>วันหมดอายุใหม่ (ตามเอกสาร) *</label><input type="date" id="r_exp"><div class="hint" id="r_th"></div></div>
      <div><label>เลขที่ใบอนุญาตใหม่ (ถ้าเปลี่ยน)</label><input type="text" id="r_no" placeholder="เว้นว่าง = ใช้เลขเดิม"></div>
      <div class="full"><label>หมายเหตุ / เหตุผลที่ส่งกลับ</label><textarea id="r_note" rows="2" placeholder="กรณีส่งกลับแก้ไข ต้องระบุเหตุผล"></textarea></div></div>
    <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn ok" id="apBtn" disabled>✅ อนุมัติและอัปเดตระบบ</button><button class="btn bad" id="rjBtn">↩️ ส่งกลับแก้ไข</button></div>
  </div></div>`;
  $('#ov').classList.add('on'); $('#drawer').classList.remove('on');
  const upd=()=>{ const all=[...document.querySelectorAll('.rc')].every(x=>x.checked); $('#apBtn').disabled=!(all&&$('#r_exp').value); const v=$('#r_exp').value; $('#r_th').textContent=v?'= '+fd(v)+' (พ.ศ.)':''; };
  document.querySelectorAll('.rc').forEach(x=>x.onchange=upd); $('#r_exp').oninput=upd;
  $('#apBtn').onclick=()=>doReview(subId,'approve');
  $('#rjBtn').onclick=()=>doReview(subId,'reject');
}
function doReview(subId,dec){
  const p={newExpiry:$('#r_exp').value,newLicNo:$('#r_no').value.trim(),note:$('#r_note').value.trim()};
  if(dec==='reject'&&!p.note){toast('กรุณาระบุเหตุผลที่ส่งกลับแก้ไข',1);$('#r_note').focus();return;}
  if(dec==='approve'&&!confirm('ยืนยันอนุมัติ และบันทึกวันหมดอายุใหม่เป็น '+fd(p.newExpiry)+' ?')) return;
  $('#apBtn').disabled=true;$('#rjBtn').disabled=true;(dec==='approve'?$('#apBtn'):$('#rjBtn')).innerHTML='<span class="spin">⏳</span> กำลังดำเนินการ…';
  google.script.run.withSuccessHandler(()=>{ closeAll(); toast(dec==='approve'?'🎉 อนุมัติเรียบร้อย แจ้งเจ้าหน้าที่แล้ว':'↩️ ส่งกลับแก้ไขแล้ว'); if(dec==='approve') confetti(); load(); })
    .withFailureHandler(e=>{toast(e.message,1);$('#rjBtn').disabled=false;$('#apBtn').disabled=false;$('#apBtn').textContent='✅ อนุมัติและอัปเดตระบบ';$('#rjBtn').textContent='↩️ ส่งกลับแก้ไข';}).reviewSubmission(subId,dec,p);
}

/* ---------- log ---------- */
function rLog(){
  $('#view').innerHTML = `<div class="hero"><div><h1><span>ประวัติการดำเนินการ</span></h1><p>บันทึกการส่งอีเมล การรับเอกสาร การอนุมัติ (80 รายการล่าสุด)</p></div></div>
  <div class="card" style="margin-top:14px"><div class="tl">${D.log.map(e=>{ const m={'แจ้งครั้งที่ 1':'warn','แจ้งครั้งที่ 2':'bad','ได้รับเอกสาร':'vio','อนุมัติ':'ok','ส่งกลับแก้ไข':'warn','ผิดพลาด':'bad'}; return `<div class="e"><time>${ft(e.at)}</time><span class="ty"><span class="chip ${m[e.type]||'gray'}">${esc(e.type)}</span></span><span>${e.staffId?`<b>${esc(e.staffId)}</b> `:''}${esc(e.detail)}${e.by&&e.by!=='ระบบ'?` <span style="color:var(--muted)">— ${esc(e.by)}</span>`:''}</span></div>`; }).join('')||'<div class="empty">ยังไม่มีประวัติ</div>'}</div></div>`;
}

/* ---------- misc ---------- */
$('#runBtn').onclick=function(){ const b=this; b.disabled=true; b.innerHTML='<span class="spin">🔄</span> กำลังตรวจ…';
  google.script.run.withSuccessHandler(m=>{toast('✅ '+m);b.disabled=false;b.innerHTML='🔄 ตรวจตอนนี้';load();}).withFailureHandler(e=>{toast(e.message,1);b.disabled=false;b.innerHTML='🔄 ตรวจตอนนี้';}).runCheckNow(); };
function toast(m,err){ const t=document.createElement('div'); t.className='toast'+(err?' err':''); t.textContent=m; $('#toasts').appendChild(t); setTimeout(()=>t.remove(),4200); }
function setTheme(t){ document.documentElement.dataset.theme=t; $('#themeBtn').textContent=t==='dark'?'☀️':'🌙'; try{localStorage.setItem('lic-theme',t);}catch(e){} }
$('#themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
(function(){ let t='light'; try{ t=localStorage.getItem('lic-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); }catch(e){} setTheme(t); })();

function confetti(){
  const cv=$('#cf'),ctx=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.55,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:Math.random()*8+4,c:COLORS[Math.floor(Math.random()*COLORS.length)],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let f=0;(function step(){ ctx.clearRect(0,0,cv.width,cv.height); ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});
    if(++f<130) requestAnimationFrame(step); else ctx.clearRect(0,0,cv.width,cv.height); })();
}
load();
</script>
</body>
</html>
